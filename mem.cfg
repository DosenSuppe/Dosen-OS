; Memory layout for the byte-addressed 32-bit Emulator.
;
; Addresses and sizes are BYTE addresses (the toolchain runs with
; WordConfig.BYTE_ADDRESSED = True, so the linker places word i of a segment at
; Start + i*4 and pointer arithmetic in C scales by 4). RAM is 0x00000000 -
; 0xBFFFFFFF (3 GiB, sparse-paged on the host); MMIO lives at 0xC0000000+.
;
; Segments are spaced generously now that we have a 3 GiB byte space — the C32R
; ROM format only stores regions that hold code/data, so empty gaps cost nothing.

.Kernel:          Start = 0x00000000, Size = 0x0000FFFF ; boot + KernelDispatch + PushProc/PopProc (PC resets to 0)
.SyscallTable:    Start = 0x00010000, Size = 0x00000FFF ; fixed jump table; user programs CALL [SYS_x]
.InterruptVector: Start = 0x00011000, Size = 0x00000FFF ; IRQ handler
.KeyboardDriver:  Start = 0x00012000, Size = 0x00000FFF ; keyboard read routines
.TTYDriver:       Start = 0x00013000, Size = 0x000000FF ; TTY char output + clear
.ScreenDriver:    Start = 0x00013100, Size = 0x000000FF ; (reserved name; graphics is compiled C)

; --- Process tracking ---
.ProcStack:       Start = 0x00014000, Size = 0x000000FF ; foreground-process slot stack
.ProcStackTop:    Start = 0x00014100, Size = 0x00000004 ; current proc-stack pointer

; --- Call stack: SET_SP uses .Stack.Start and the stack grows DOWN, into the
;     large empty gap below 0x00080000 (down toward 0x00014104). ~430 KiB runway. ---
.Stack:           Start = 0x00080000, Size = 0x00000FFF

; --- C runtime ---
.CCode:   Start = 0x00100000, Size = 0x000FFFFF ; compiled C code (1 MiB byte window)
.CBridge: Start = 0x00200000, Size = 0x0000FFFF ; asm wrappers adapting C ABI to drivers
.Heap:    Start = 0x00210000, Size = 0x000FFFFF ; heap for malloc
.CData:   Start = 0x00400000, Size = 0x00FFFFFF ; C globals + string literals (16 MiB)

; --- User-program loader ---
.UserPrograms: Start = 0x01400000, Size = 0x000FFFFF ; built-in program blobs + ProgramRegistry
.UserCode:     Start = 0x01500000, Size = 0x00FFFFFF ; window the loader copies the running program into

; --- Memory-mapped devices (slots at 0xC0000000+, 128 MiB / 0x08000000 each) ---
.MemDevice0: Start = 0xC0000000, Size = 0x07FFFFFF ; keyboard      (read local 0 pops a keycode)
.MemDevice1: Start = 0xC8000000, Size = 0x07FFFFFF ; TTY           (clear @ +4, write-char @ +8)
.MemDevice2: Start = 0xD0000000, Size = 0x07FFFFFF ; framebuffer   (pixel N @ +N*4; cmds @ +0xF0000..)
.MemDevice3: Start = 0xD8000000, Size = 0x07FFFFFF ; NIC (Network Interface Card)
.MemDevice4: Start = 0xE0000000, Size = 0x07FFFFFF ; free
.MemDevice5: Start = 0xE8000000, Size = 0x07FFFFFF ; free
.MemDevice6: Start = 0xF0000000, Size = 0x07FFFFFF ; free
.MemDevice7: Start = 0xF8000000, Size = 0x07FFFFFF ; PermaStorage high (device bytes 0x100000-0x1FFFFF)
