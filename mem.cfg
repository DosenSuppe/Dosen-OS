.Kernel: Start = 0x000000, Size = 0x000FFF

.Stack: Start = 0x001000, Size = 0x0000FF
.InterruptVector: Start = 0x001100, Size = 0x0000FF
.StringLib: Start = 0x001200, Size = 0x2FF

; Drivers memory space 0x002000 - 0x008000
.KeyboardDriver: Start = 0x002000, Size = 0x000FFF
.TTYDriver: Start = 0x003000, Size = 0x0000FF
.ScreenDriver: Start = 0x00600, Size = 0x0000FF

.CharactersMapping: Start = 0x003100, Size = 0x0000FF

.CommandCharacterBuffer: Start = 0x004000, Size = 0x00001F
.Commands: Start = 0x004020, Size = 0x0004DF

.FilenameStorage: Start = 0x004300, Size = 0x3FF ; ~ 255 words (1word for length and 254 string space)
.FileStorage: Start = 0x005000, Size = 0x000FFC ; 0xFFC/4 -> 1023 words per file

; --- C runtime: compiled C output and globals ---
.CCode:   Start = 0x006000, Size = 0x003FFF ; 16KW of compiled C code
.CData:   Start = 0x00A000, Size = 0x000FFF ; 4KW of C globals and string literals
.CBridge: Start = 0x00B000, Size = 0x000FFF ; 4KW for asm wrappers that adapt C ABI to drivers
.Heap:    Start = 0x00C000, Size = 0x000FFF ; 4KW for heap

.EditorState: Start = 0x010000, Size = 0x000300 ; line-editor scratch (active flag, filename, ≤512-char draft buffer)

.MemDevice0: Start = 0x800000, Size = 0x0FFFFF ; currently hardcoded for keybaord
.MemDevice1: Start = 0x900000, Size = 0x0FFFFF ; currently hardcoded for TTY
.MemDevice2: Start = 0xA00000, Size = 0x0FFFFF ; currently hardcoded for time provider (WIP)
.MemDevice3: Start = 0xB00000, Size = 0x0FFFFF
.MemDevice4: Start = 0xC00000, Size = 0x0FFFFF
.MemDevice5: Start = 0xD00000, Size = 0x0FFFFF
.MemDevice6: Start = 0xE00000, Size = 0x0FFFFF
.MemDevice7: Start = 0xF00000, Size = 0x0FFFFF
