.Kernel:       Start = 0x000000, Size = 0x000F00 ; kernel code (capped so .SyscallTable can sit at the top)
.SyscallTable: Start = 0x000F00, Size = 0x0000FF ; fixed-address jump table: user programs CALL [SYS_x] to invoke kernel services

.Stack: Start = 0x001000, Size = 0x0000FF
.InterruptVector: Start = 0x001100, Size = 0x0000FF

; Drivers memory space 0x002000 - 0x008000
.KeyboardDriver: Start = 0x002000, Size = 0x000FFF
.TTYDriver: Start = 0x003000, Size = 0x0000FF
.ScreenDriver: Start = 0x003100, Size = 0x0000FF

; --- Process tracking ---
.ProcStack:    Start = 0x004000, Size = 0xF     ; foreground-process slot stack (onkey/main routines)
.ProcStackTop: Start = 0x004010, Size = 0x1     ; current proc-stack pointer

; --- C runtime: compiled C output and globals ---
.CCode:   Start = 0x008000, Size = 0x003FFF ; 16KW of compiled C code
.CData:   Start = 0x00C000, Size = 0x000FFF ; 4KW of C globals and string literals
.CBridge: Start = 0x00D000, Size = 0x000FFF ; 4KW for asm wrappers that adapt C ABI to drivers
.Heap:    Start = 0x00E000, Size = 0x000FFF ; 4KW for heap

; --- User-program loader ---
.UserPrograms: Start = 0x00F000, Size = 0x000FFF ; built-in program blobs + ProgramRegistry table
.UserCode:     Start = 0x010000, Size = 0x00FFFF ; window the loader copies the running program into

; --- Memory-mapped devices ---
.MemDevice0: Start = 0x800000, Size = 0x0FFFFF ; keyboard
.MemDevice1: Start = 0x900000, Size = 0x0FFFFF ; TTY
.MemDevice2: Start = 0xA00000, Size = 0x0FFFFF ; framebuffer (320x200 24-bit RGB)
.MemDevice3: Start = 0xB00000, Size = 0x0FFFFF
.MemDevice4: Start = 0xC00000, Size = 0x0FFFFF
.MemDevice5: Start = 0xD00000, Size = 0x0FFFFF
.MemDevice6: Start = 0xE00000, Size = 0x0FFFFF ; PermaStorageDevice (slot 6 of 2)
.MemDevice7: Start = 0xF00000, Size = 0x0FFFFF ; PermaStorageDevice (slot 7 of 2)

; for debugging rn: printint pos is at ADDR: 0x0093B3
