; Link config for standalone disk-loadable programs.
;
; A program is linked on its own, based at the same byte address the OS loader
; copies it to: $UserCode.Start = 0x01500000 (see ../mem.cfg). All local labels
; and data therefore resolve to their final runtime addresses. Kernel services
; are reached via fixed-address syscall slots (declared in the program source),
; so no other segment needs to be defined here.
;
; Keep this Start in sync with .UserCode in ../mem.cfg.

.Program: Start = 0x01500000, Size = 0x00FFFFFF
